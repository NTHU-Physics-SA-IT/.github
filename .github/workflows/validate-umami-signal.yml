name: Validate Umami profile signal

on:
  pull_request:
    paths:
      - ".github/workflows/*umami-signal.yml"
      - "docs/umami-signal-sync.md"
      - "profile/assets/header-*.svg"
      - "scripts/render_umami_signal.py"
      - "scripts/validate_profile.py"
      - "tests/fixtures/umami-*.json"
      - "tests/test_render_umami_signal.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render sanitized fixture outside the checkout
        shell: bash
        run: |
          python scripts/render_umami_signal.py \
            --pageviews-fixture tests/fixtures/umami-pageviews.json \
            --stats-fixture tests/fixtures/umami-stats.json \
            --output-root "$RUNNER_TEMP/umami-fixture-output"

      - name: Run generator tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate committed profile assets
        run: python scripts/validate_profile.py

      - name: Check whitespace errors
        run: git diff --check
