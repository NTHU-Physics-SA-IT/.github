name: Sync Umami profile signal

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC: 00:17, 06:17, 12:17, 18:17 Asia/Taipei.
    - cron: "17 4,10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: sync-umami-profile-signal
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'NTHU-Physics-SA-IT/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      UMAMI_REGION: ${{ vars.UMAMI_REGION || 'us' }}
      UMAMI_TIMEZONE: ${{ vars.UMAMI_TIMEZONE || 'Asia/Taipei' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository configuration
        shell: bash
        run: |
          missing=()
          [[ -n "$UMAMI_API_KEY" ]] || missing+=("UMAMI_API_KEY secret")
          [[ -n "$UMAMI_WEBSITE_ID" ]] || missing+=("UMAMI_WEBSITE_ID variable")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Render aggregate traffic snapshot
        run: python scripts/render_umami_signal.py

      - name: Run fixture tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate profile SVG and geometry
        run: python scripts/validate_profile.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit changed snapshot
        shell: bash
        run: |
          git add \
            profile/assets/header-light.svg \
            profile/assets/header-mobile-light.svg \
            profile/assets/data/umami-snapshot.json

          if git diff --cached --quiet; then
            echo "Umami snapshot is unchanged; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(analytics): refresh profile signal [skip ci]"
          git push origin HEAD:main
