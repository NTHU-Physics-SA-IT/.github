<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NTHU Physics Student Association IT Team</title>
  <desc id="desc">Light organization header with the team identity, a one-time terminal boot sequence, and an aggregate 24-hour Umami traffic snapshot.</desc>
  <defs>
    <clipPath id="terminal-reveal">
      <rect x="52" y="167" width="0" height="22">
        <animate attributeName="width" values="0;0;48;96;144;192;240;288;336;344" keyTimes="0;.08;.18;.28;.38;.48;.58;.68;.78;1" calcMode="discrete" dur="1.4s" begin=".2s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="52" y="191" width="0" height="22">
        <animate attributeName="width" values="0;0;60;120;180;240;300;360;418" keyTimes="0;.08;.2;.32;.44;.56;.68;.82;1" calcMode="discrete" dur="1s" begin="1.7s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="52" y="215" width="0" height="22">
        <animate attributeName="width" values="0;0;60;120;180;240;300;360;418" keyTimes="0;.08;.2;.32;.44;.56;.68;.82;1" calcMode="discrete" dur="1s" begin="2.8s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="52" y="239" width="0" height="22">
        <animate attributeName="width" values="0;0;55;110;165;220;275;330" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="3.9s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="52" y="263" width="0" height="22">
        <animate attributeName="width" values="0;0;56;112;168;224;280;340" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="4.8s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="52" y="287" width="0" height="22">
        <animate attributeName="width" values="0;0;45;90;135;180;225;270" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="5.7s" repeatCount="1" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      text {
        font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-weight: 500;
      }
      .panel { fill: #FFFFFF; }
      .raised { fill: #F4F7F8; }
      .primary { fill: #0A1720; }
      .muted { fill: #536875; }
      .green { fill: #087A4B; }
      .cyan { fill: #006D85; }
      .amber { fill: #8A6500; }
      .border { stroke: #B8C9D1; }
      .brand { font-size: 24px; font-weight: 550; letter-spacing: .6px; }
      .brand-zh { font-size: 17px; font-weight: 400; letter-spacing: .5px; }
      .tagline { font-size: 13px; font-weight: 600; letter-spacing: .35px; }
      .meta { font-size: 12px; font-weight: 500; letter-spacing: .35px; }
      .terminal { font-size: 14px; font-weight: 500; }
      .terminal-strong { font-weight: 600; }
      .signal-heading { font-size: 13px; font-weight: 700; letter-spacing: .45px; }
      .signal-copy { font-size: 11px; font-weight: 400; letter-spacing: .2px; }
      .signal-label { font-size: 11px; font-weight: 500; letter-spacing: .25px; }
      .signal-telemetry { font-size: 11px; font-weight: 500; letter-spacing: .1px; }
      .rail { font-size: 12px; font-weight: 500; letter-spacing: .65px; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="336" rx="4" class="panel border" stroke-width="1.5"/>

  <g aria-hidden="true">
    <path d="M28 54H1172" class="border" stroke-width="1"/>
    <rect x="28" y="27" width="8" height="8" class="green"/>
  </g>
  <text x="48" y="36" class="meta muted">ORG PROFILE / SYSTEM CONSOLE</text>
  <text x="1168" y="36" text-anchor="end" class="meta muted">PUBLIC / ONLINE</text>

  <text x="40" y="92" class="brand">NTHU PHYSICS SA // IT TEAM</text>
  <text x="40" y="121" class="brand-zh primary">清大物理系系學會資訊組</text>
  <text x="40" y="146" class="tagline cyan">BUILDING RELIABLE DIGITAL INFRASTRUCTURE FOR PHYSICS STUDENTS</text>

  <rect x="32" y="158" width="700" height="162" rx="4" class="raised border" stroke-width="1.2"/>
  <rect x="43.5" y="168" width="2" height="136" class="green" opacity=".65"/>

  <g class="static-fallback terminal">
    <text x="52" y="184" class="green terminal-strong">&gt; boot --organization NTHU-Physics-SA-IT</text>
    <text x="52" y="208" class="primary">[ OK ] IDENTITY     : PHYSICS STUDENT ASSOCIATION</text>
    <text x="52" y="232" class="primary">[ OK ] UNIT         : INFORMATION TECHNOLOGY TEAM</text>
    <text x="52" y="256" class="primary">[ OK ] PLATFORM     : STUDENT SYSTEMS</text>
    <text x="52" y="280" class="amber">[ RUN ] MISSION     : BUILD RELIABLE TOOLS</text>
    <text x="52" y="304" class="green terminal-strong">[READY] STATUS      : ONLINE_</text>
  </g>

  <g class="motion-layer">
    <rect x="48" y="164" width="672" height="146" class="raised" opacity="0">
      <set attributeName="opacity" to="1" begin=".05s" fill="freeze"/>
    </rect>
    <g class="terminal" clip-path="url(#terminal-reveal)">
      <text x="52" y="184" class="green terminal-strong">&gt; boot --organization NTHU-Physics-SA-IT</text>
      <text x="52" y="208" class="primary">[ OK ] IDENTITY     : PHYSICS STUDENT ASSOCIATION</text>
      <text x="52" y="232" class="primary">[ OK ] UNIT         : INFORMATION TECHNOLOGY TEAM</text>
      <text x="52" y="256" class="primary">[ OK ] PLATFORM     : STUDENT SYSTEMS</text>
      <text x="52" y="280" class="amber">[ RUN ] MISSION     : BUILD RELIABLE TOOLS</text>
      <text x="52" y="304" class="green terminal-strong">[READY] STATUS      : ONLINE</text>
    </g>
    <rect x="288" y="291" width="8" height="15" class="green" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="6.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- UMAMI GENERATED SIGNAL START -->
  <g aria-label="Umami traffic snapshot" data-generated-at="pending" data-pageviews="pending" data-visitors="pending">
    <text x="790" y="98" class="signal-heading cyan">SYSTEM SIGNAL</text>
    <text x="790" y="119" class="signal-copy muted">24H TRAFFIC / HOURLY PAGEVIEWS</text>
    <path d="M790 220H1160" class="border" stroke-width="1" opacity=".55"/>
    <path data-umami-signal="desktop" d="M790 220L806.1 220L822.2 220L838.3 220L854.3 220L870.4 220L886.5 220L902.6 220L918.7 220L934.8 220L950.9 220L967 220L983 220L999.1 220L1015.2 220L1031.3 220L1047.4 220L1063.5 220L1079.6 220L1095.7 220L1111.7 220L1127.8 220L1143.9 220L1160 220"
          fill="none" stroke="#006D85" stroke-width="1.7"/>
    <g class="signal-motion" aria-hidden="true">
      <circle r="3.5" class="cyan">
        <animateMotion dur="10s" repeatCount="indefinite" path="M790 220L806.1 220L822.2 220L838.3 220L854.3 220L870.4 220L886.5 220L902.6 220L918.7 220L934.8 220L950.9 220L967 220L983 220L999.1 220L1015.2 220L1031.3 220L1047.4 220L1063.5 220L1079.6 220L1095.7 220L1111.7 220L1127.8 220L1143.9 220L1160 220"/>
      </circle>
    </g>
    <text x="790" y="250" class="signal-telemetry primary">VIEWS      --</text>
    <text x="790" y="271" class="signal-telemetry primary">VISITORS   --</text>
    <text x="790" y="292" class="signal-telemetry muted">UPDATED    PENDING API SYNC</text>
  </g>
  <!-- UMAMI GENERATED SIGNAL END -->

  <path d="M28 336H1172" class="border" stroke-width="1"/>
</svg>
