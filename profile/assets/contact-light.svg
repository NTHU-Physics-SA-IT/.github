<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 190"
     role="img"
     aria-labelledby="contact-title contact-desc">
  <title id="contact-title">Contact the NTHU Physics Student Association IT Team</title>
  <desc id="contact-desc">A light engineering contact console with public GitHub and Physics Archive endpoints connected through a logical routing schematic.</desc>
  <defs>
    <pattern id="contact-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#B8C9D1" stroke-width=".7" opacity=".55"/>
    </pattern>
    <style>
      .mono {
        font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-weight: 700;
      }
      .command { font-weight: 800; }
      .label { font-weight: 800; letter-spacing: .45px; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="166" rx="4" fill="#FFFFFF" stroke="#B8C9D1" stroke-width="1.5"/>
  <path d="M12 48H1188" stroke="#B8C9D1" stroke-width="1.5"/>

  <rect x="25" y="27" width="9" height="9" rx="1" fill="#087A4B"/>
  <text x="46" y="37" class="mono label" font-size="13" fill="#536875">CONTACT CONSOLE / PUBLIC ENDPOINTS</text>
  <text x="1174" y="37" text-anchor="end" class="mono label" font-size="12" fill="#536875">DWG C-01 / REV 02 / READY</text>

  <g aria-label="Public contact information">
    <text x="30" y="75" class="mono command" font-size="18" fill="#0A1720">&gt; connect --organization NTHU-Physics-SA-IT</text>
    <text x="30" y="108" class="mono" font-size="16" fill="#0A1720">
      <tspan fill="#006D85">GITHUB</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>github.com/NTHU-Physics-SA-IT</tspan>
    </text>
    <text x="30" y="134" class="mono" font-size="16" fill="#0A1720">
      <tspan fill="#006D85">SYSTEM</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>physarchive.com</tspan>
    </text>
    <text x="30" y="160" class="mono" font-size="16" fill="#087A4B">
      <tspan>STATUS</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>OPEN TO CONTRIBUTIONS_</tspan>
    </text>
  </g>

  <g aria-label="Public contact routing schematic">
    <rect x="790" y="56" width="382" height="110" rx="4" fill="#EAF0F2" stroke="#B8C9D1" stroke-width="1.5"/>
    <rect x="790" y="56" width="382" height="110" rx="4" fill="url(#contact-grid)"/>
    <path d="M790 80H1172" stroke="#B8C9D1" stroke-width="1"/>
    <text x="802" y="73" class="mono label" font-size="10.5" fill="#0A1720">PUBLIC CONTACT ROUTING / LOGICAL</text>
    <text x="1160" y="73" text-anchor="end" class="mono" font-size="9.5" fill="#536875">PORT / NODE / HTTPS</text>

    <path d="M882 125H916M916 103V147M916 103H947M916 147H947M1050 103H1062V125H1079M1050 147H1062V125"
          fill="none" stroke="#006D85" stroke-width="1.5"/>
    <circle cx="916" cy="125" r="5" fill="#006D85"/>
    <circle cx="1062" cy="125" r="2" fill="#006D85"/>
    <circle cx="1062" cy="103" r="2" fill="#006D85"/>
    <circle cx="1062" cy="147" r="2" fill="#006D85"/>
    <text x="900" y="137" class="mono label" font-size="9" fill="#536875">J01</text>
    <text x="921" y="97" class="mono label" font-size="9.5" fill="#006D85">ISSUE / PR</text>
    <text x="921" y="141" class="mono label" font-size="9.5" fill="#006D85">USE / FEEDBACK</text>

    <rect x="802" y="109" width="76" height="32" rx="2" fill="#FFFFFF" stroke="#B8C9D1"/>
    <rect x="799" y="122" width="7" height="7" fill="#006D85"/>
    <rect x="875" y="122" width="7" height="7" fill="#006D85"/>
    <text x="840" y="122" text-anchor="middle" class="mono label" font-size="10.5" fill="#0A1720">P01 PUBLIC</text>
    <text x="840" y="135" text-anchor="middle" class="mono" font-size="9.5" fill="#536875">HTTPS</text>

    <rect x="950" y="88" width="96" height="30" rx="2" fill="#FFFFFF" stroke="#B8C9D1"/>
    <rect x="947" y="100" width="7" height="7" fill="#006D85"/>
    <rect x="1043" y="100" width="7" height="7" fill="#006D85"/>
    <text x="998" y="100" text-anchor="middle" class="mono label" font-size="10.5" fill="#0A1720">E01 GITHUB</text>
    <text x="998" y="113" text-anchor="middle" class="mono" font-size="9.5" fill="#536875">HTTPS</text>

    <rect x="950" y="132" width="96" height="30" rx="2" fill="#FFFFFF" stroke="#B8C9D1"/>
    <rect x="947" y="144" width="7" height="7" fill="#006D85"/>
    <rect x="1043" y="144" width="7" height="7" fill="#006D85"/>
    <text x="998" y="144" text-anchor="middle" class="mono label" font-size="10.5" fill="#8A6500">E02 ARCHIVE</text>
    <text x="998" y="157" text-anchor="middle" class="mono" font-size="9.5" fill="#536875">HTTPS</text>

    <rect x="1082" y="109" width="76" height="32" rx="2" fill="#FFFFFF" stroke="#087A4B"/>
    <rect x="1079" y="122" width="7" height="7" fill="#006D85"/>
    <rect x="1155" y="122" width="7" height="7" fill="#087A4B"/>
    <text x="1120" y="129" text-anchor="middle" class="mono label" font-size="11" fill="#087A4B">C01 OPEN</text>
  </g>
</svg>
