<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="contact-mobile-title contact-mobile-desc">
  <title id="contact-mobile-title">Contact the NTHU Physics Student Association IT Team</title>
  <desc id="contact-mobile-desc">Mobile dark scientific terminal console listing the GitHub organization, Physics Archive website, and open contribution status.</desc>
  <style>
    text {
      font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
      font-weight: 700;
    }
    .command { font-weight: 800; }
  </style>

  <rect width="720" height="300" rx="16" fill="#050A10"/>
  <rect x="4" y="4" width="712" height="292" rx="13" fill="#09131D" stroke="#1B3A4B" stroke-width="2"/>
  <path d="M4 44H716" stroke="#1B3A4B" stroke-width="2"/>

  <circle cx="25" cy="24" r="5" fill="#65F2AE"/>
  <circle cx="44" cy="24" r="5" fill="#55D8F5"/>
  <circle cx="63" cy="24" r="5" fill="#EBCB72"/>
  <text x="82" y="30" font-size="16" fill="#91A6B5">CONTACT CONSOLE // PUBLIC</text>
  <text x="694" y="30" text-anchor="end" font-size="16" fill="#91A6B5">LINK: READY</text>

  <text x="28" y="82" class="command" font-size="22" fill="#F1F6F8">&gt; connect --organization NTHU-Physics-SA-IT</text>
  <text x="28" y="126" font-size="21" fill="#F1F6F8">
    <tspan fill="#55D8F5">GITHUB</tspan>
    <tspan fill="#91A6B5"> : </tspan>
    <tspan>github.com/NTHU-Physics-SA-IT</tspan>
  </text>
  <text x="28" y="166" font-size="21" fill="#F1F6F8">
    <tspan fill="#55D8F5">SYSTEM</tspan>
    <tspan fill="#91A6B5"> : </tspan>
    <tspan>physarchive.com</tspan>
  </text>
  <text x="28" y="206" font-size="21" fill="#65F2AE">
    <tspan>STATUS</tspan>
    <tspan fill="#91A6B5"> : </tspan>
    <tspan>OPEN TO CONTRIBUTIONS_</tspan>
  </text>

  <g aria-hidden="true">
    <rect x="28" y="224" width="664" height="50" rx="8" fill="#0D1B27" stroke="#1B3A4B" stroke-width="2"/>
    <path d="M48 249H672" stroke="#1B3A4B" stroke-width="1"/>
    <path d="M82 233V266M204 233V266M326 233V266M448 233V266M570 233V266" stroke="#1B3A4B" stroke-width="1"/>
    <path d="M48 254H82L98 238L118 267L142 232L163 254H204L221 245L239 254H286L305 230L322 271L344 254H392L410 242L430 263L448 254H496L515 235L533 268L552 254H608L624 244L640 254H672"
          fill="none" stroke="#55D8F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="204" cy="249" r="5" fill="#65F2AE"/>
    <circle cx="448" cy="249" r="5" fill="#09131D" stroke="#65F2AE" stroke-width="2"/>
    <rect x="632" y="263" width="40" height="4" rx="2" fill="#EBCB72"/>
  </g>
</svg>
