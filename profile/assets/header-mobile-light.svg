<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">NTHU Physics Student Association IT Team mobile header</title>
  <desc id="desc">Light mobile organization header with the team identity, a one-time terminal boot sequence, and an aggregate 24-hour Umami traffic snapshot.</desc>
  <defs>
    <clipPath id="terminal-reveal">
      <rect x="48" y="181" width="0" height="28">
        <animate attributeName="width" values="0;0;65;130;195;260;325;390;460" keyTimes="0;.08;.2;.32;.44;.56;.68;.82;1" calcMode="discrete" dur="1.4s" begin=".2s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="48" y="213" width="0" height="28">
        <animate attributeName="width" values="0;0;90;180;270;360;450;520;610" keyTimes="0;.08;.2;.32;.44;.56;.68;.82;1" calcMode="discrete" dur="1s" begin="1.7s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="48" y="245" width="0" height="28">
        <animate attributeName="width" values="0;0;90;180;270;360;450;520;610" keyTimes="0;.08;.2;.32;.44;.56;.68;.82;1" calcMode="discrete" dur="1s" begin="2.8s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="48" y="277" width="0" height="28">
        <animate attributeName="width" values="0;0;76;152;228;304;380;460" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="3.9s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="48" y="309" width="0" height="28">
        <animate attributeName="width" values="0;0;80;160;240;320;400;480" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="4.8s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect x="48" y="341" width="0" height="28">
        <animate attributeName="width" values="0;0;60;120;180;240;300;360" keyTimes="0;.1;.24;.38;.52;.66;.82;1" calcMode="discrete" dur=".8s" begin="5.7s" repeatCount="1" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      text {
        font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-weight: 500;
      }
      .panel { fill: #FFFFFF; }
      .raised { fill: #F4F7F8; }
      .primary { fill: #0A1720; }
      .muted { fill: #536875; }
      .green { fill: #087A4B; }
      .cyan { fill: #006D85; }
      .amber { fill: #8A6500; }
      .border { stroke: #B8C9D1; }
      .brand { font-size: 29px; font-weight: 600; letter-spacing: .55px; }
      .brand-zh { font-size: 20px; font-weight: 400; letter-spacing: .4px; }
      .tagline { font-size: 16px; font-weight: 600; letter-spacing: .1px; }
      .meta { font-size: 15px; font-weight: 500; letter-spacing: .3px; }
      .terminal { font-size: 18.5px; font-weight: 500; }
      .terminal-strong { font-weight: 600; }
      .signal-heading { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
      .signal-label { font-size: 13px; font-weight: 500; letter-spacing: .2px; }
      .signal-telemetry { font-size: 13px; font-weight: 500; letter-spacing: .05px; }
      @media (prefers-reduced-motion: reduce) {
        .motion-layer { display: none !important; }
        .signal-motion { display: none !important; }
      }
    </style>
  </defs>

  <rect x="10" y="10" width="700" height="500" rx="6" class="panel border" stroke-width="1.5"/>
  <path d="M24 55H696" class="border" stroke-width="1"/>
  <rect x="26" y="27" width="8" height="8" class="green"/>
  <text x="45" y="38" class="meta muted">ORG / SYSTEM CONSOLE</text>
  <text x="694" y="38" text-anchor="end" class="meta muted">PUBLIC / ONLINE</text>

  <text x="36" y="96" class="brand primary">NTHU PHYSICS SA // IT TEAM</text>
  <text x="36" y="128" class="brand-zh primary">清大物理系系學會資訊組</text>
  <text x="36" y="156" class="tagline cyan">BUILDING RELIABLE DIGITAL INFRASTRUCTURE FOR PHYSICS STUDENTS</text>

  <rect x="24" y="170" width="672" height="220" rx="6" class="raised border" stroke-width="1.2"/>
  <rect x="38" y="185" width="2" height="180" class="green" opacity=".65"/>

  <g class="static-fallback terminal">
    <text x="48" y="204" class="green terminal-strong">&gt; boot --organization NTHU-Physics-SA-IT</text>
    <text x="48" y="236" class="primary">[ OK ] IDENTITY     : PHYSICS STUDENT ASSOCIATION</text>
    <text x="48" y="268" class="primary">[ OK ] UNIT         : INFORMATION TECHNOLOGY TEAM</text>
    <text x="48" y="300" class="primary">[ OK ] PLATFORM     : STUDENT SYSTEMS</text>
    <text x="48" y="332" class="amber">[ RUN ] MISSION     : BUILD RELIABLE TOOLS</text>
    <text x="48" y="364" class="green terminal-strong">[READY] STATUS      : ONLINE_</text>
  </g>

  <g class="motion-layer">
    <rect x="44" y="178" width="640" height="194" class="raised" opacity="0">
      <set attributeName="opacity" to="1" begin=".05s" fill="freeze"/>
    </rect>
    <g class="terminal" clip-path="url(#terminal-reveal)">
      <text x="48" y="204" class="green terminal-strong">&gt; boot --organization NTHU-Physics-SA-IT</text>
      <text x="48" y="236" class="primary">[ OK ] IDENTITY     : PHYSICS STUDENT ASSOCIATION</text>
      <text x="48" y="268" class="primary">[ OK ] UNIT         : INFORMATION TECHNOLOGY TEAM</text>
      <text x="48" y="300" class="primary">[ OK ] PLATFORM     : STUDENT SYSTEMS</text>
      <text x="48" y="332" class="amber">[ RUN ] MISSION     : BUILD RELIABLE TOOLS</text>
      <text x="48" y="364" class="green terminal-strong">[READY] STATUS      : ONLINE</text>
    </g>
    <rect x="365" y="348" width="10" height="20" class="green" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" begin="6.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- UMAMI GENERATED SIGNAL START -->
  <g aria-label="Umami traffic snapshot" data-generated-at="pending" data-pageviews="pending" data-visitors="pending">
    <text x="42" y="414" class="signal-heading cyan">SYSTEM SIGNAL / 24H HOURLY PAGEVIEWS</text>
    <path d="M42 450H678" class="border" stroke-width="1" opacity=".55"/>
    <path data-umami-signal="mobile" d="M42 450L69.7 450L97.3 450L125 450L152.6 450L180.3 450L207.9 450L235.6 450L263.2 450L290.9 450L318.5 450L346.2 450L373.8 450L401.5 450L429.1 450L456.8 450L484.4 450L512.1 450L539.7 450L567.4 450L595 450L622.7 450L650.3 450L678 450"
          fill="none" stroke="#006D85" stroke-width="1.8"/>
    <g class="signal-motion" aria-hidden="true">
      <circle r="3.5" class="cyan">
        <animateMotion dur="10s" repeatCount="indefinite" path="M42 450L69.7 450L97.3 450L125 450L152.6 450L180.3 450L207.9 450L235.6 450L263.2 450L290.9 450L318.5 450L346.2 450L373.8 450L401.5 450L429.1 450L456.8 450L484.4 450L512.1 450L539.7 450L567.4 450L595 450L622.7 450L650.3 450L678 450"/>
      </circle>
    </g>
    <text x="42" y="477" class="signal-telemetry primary">VIEWS --</text>
    <text x="288" y="477" class="signal-telemetry primary">VISITORS --</text>
    <text x="42" y="501" class="signal-telemetry muted">UPDATED PENDING API SYNC</text>
  </g>
  <!-- UMAMI GENERATED SIGNAL END -->
</svg>
