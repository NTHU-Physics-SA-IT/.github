<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" role="img" aria-labelledby="title desc">
  <title id="title">PHYSARCHIVE — NTHU Physics Past Exam Platform</title>
  <desc id="desc">Mobile light-mode engineering console card for the student archive platform, showing course search and preview, submission, review, discussion, and its verified technology stack.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#B8C9D1" stroke-width="0.6" opacity="0.42"/>
    </pattern>
    <style>
      text{font-family:"Courier New",Courier,"Liberation Mono","DejaVu Sans Mono",monospace;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1.5}
      .raised{fill:#F4F7F8;stroke:#B8C9D1;stroke-width:1}
      .module{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1}
      .divider{fill:none;stroke:#B8C9D1;stroke-width:1}
      .primary{fill:#0A1720}.muted{fill:#536875}.green{fill:#087A4B}.cyan{fill:#006D85}.amber{fill:#8A6500}
      .title{font-size:25px;font-weight:900;letter-spacing:0.6px}
      .subtitle{font-size:14px;font-weight:800}
      .meta{font-size:11.5px;font-weight:700;letter-spacing:0.2px}
      .label{font-size:11px;font-weight:800;letter-spacing:0.6px}
      .stack{font-size:9.5px;font-weight:700;letter-spacing:0.1px}
      .node-id{font-size:9px;font-weight:800;letter-spacing:0.5px}
      .node-meta{font-size:8.5px;font-weight:700}
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="700" height="496" rx="6"/>
  <path class="divider" d="M10 58H710M466 18V50"/>
  <rect x="26" y="29" width="8" height="8" class="green"/>
  <text x="46" y="38" class="label primary">PROJECT CONSOLE / 01</text>
  <text x="694" y="38" text-anchor="end" class="label green">STATUS: ACTIVE DEVELOPMENT</text>
  <text x="26" y="53" class="meta muted">PUBLIC STUDENT SYSTEM</text>

  <rect x="26" y="72" width="668" height="122" rx="3" fill="none" stroke="#B8C9D1" stroke-width="1"/>
  <text x="46" y="106" class="title primary">PHYSARCHIVE</text>
  <text x="46" y="138" class="subtitle primary">NTHU PHYSICS PAST EXAM PLATFORM</text>
  <text x="46" y="174" class="meta muted">SEARCHABLE MATERIALS / STUDENT WORKFLOWS</text>
  <text x="674" y="104" text-anchor="end" class="label muted">REPOSITORY</text>
  <text x="674" y="128" text-anchor="end" class="meta primary">NTHU-Physics-SA-IT/PastExamWeb_PHY</text>
  <text x="674" y="152" text-anchor="end" class="label muted">LIVE</text>
  <text x="674" y="176" text-anchor="end" class="meta green">physarchive.com</text>

  <rect class="raised" x="26" y="208" width="668" height="136" rx="3"/>
  <rect x="26" y="208" width="668" height="136" rx="3" fill="url(#grid)"/>
  <text x="42" y="232" class="label cyan">QUERY / COURSE ARCHIVE</text>
  <text x="678" y="232" text-anchor="end" class="meta muted">DOCUMENT INDEX</text>
  <rect class="module" x="42" y="242" width="636" height="30" rx="2"/>
  <rect x="54" y="253" width="8" height="8" fill="none" stroke="#087A4B" stroke-width="1.5"/>
  <path d="M61 260L66 265" stroke="#087A4B" stroke-width="1.5"/>
  <text x="76" y="262" class="meta muted">course / semester / instructor / exam type</text>

  <rect class="module" x="42" y="284" width="194" height="44" rx="2"/>
  <rect x="54" y="297" width="6" height="6" class="green"/>
  <text x="70" y="303" class="label primary">COURSE INDEX</text>
  <text x="54" y="319" class="node-meta muted">COURSE / SEMESTER / ANSWER FILTER</text>

  <rect class="module" x="248" y="284" width="194" height="44" rx="2"/>
  <rect x="260" y="297" width="6" height="6" class="cyan"/>
  <text x="276" y="303" class="label primary">PDF PREVIEW</text>
  <text x="260" y="319" class="node-meta muted">PREVIEW / DOWNLOAD / COMMENTS</text>

  <rect class="module" x="454" y="284" width="224" height="44" rx="2"/>
  <rect x="466" y="297" width="6" height="6" class="amber"/>
  <text x="482" y="303" class="label primary">SUBMIT + REVIEW</text>
  <text x="466" y="319" class="node-meta green">SUBMISSION STATUS / DISCUSS</text>

  <rect class="raised" x="26" y="358" width="668" height="112" rx="3"/>
  <rect x="26" y="358" width="668" height="112" rx="3" fill="url(#grid)"/>
  <text x="42" y="382" class="label cyan">WORKFLOW / VERIFIED STACK</text>
  <text x="678" y="382" text-anchor="end" class="meta muted">ARCHIVE OPERATIONS</text>
  <rect class="module" x="42" y="392" width="120" height="26" rx="2"/>
  <rect x="52" y="402" width="6" height="6" class="green"/>
  <text x="68" y="409" class="label primary">SEARCH</text>
  <rect class="module" x="171" y="392" width="120" height="26" rx="2"/>
  <rect x="181" y="402" width="6" height="6" class="cyan"/>
  <text x="197" y="409" class="label primary">PREVIEW</text>
  <rect class="module" x="300" y="392" width="120" height="26" rx="2"/>
  <rect x="310" y="402" width="6" height="6" class="amber"/>
  <text x="326" y="409" class="label primary">SUBMIT</text>
  <rect class="module" x="429" y="392" width="120" height="26" rx="2"/>
  <rect x="439" y="402" width="6" height="6" class="green"/>
  <text x="455" y="409" class="label primary">REVIEW</text>
  <rect class="module" x="558" y="392" width="120" height="26" rx="2"/>
  <rect x="568" y="402" width="6" height="6" class="cyan"/>
  <text x="584" y="409" class="label primary">DISCUSS</text>
  <path class="divider" d="M42 426H678M360 432V460"/>
  <text x="42" y="442" class="stack muted"><tspan class="cyan">FRONTEND  </tspan><tspan>VUE 3 / VITE / PRIMEVUE / TAILWIND CSS</tspan></text>
  <text x="376" y="442" class="stack muted"><tspan class="green">BACKEND  </tspan><tspan>PYTHON / FASTAPI / SQLMODEL / ALEMBIC</tspan></text>
  <text x="42" y="460" class="stack muted"><tspan class="amber">DATA      </tspan><tspan>POSTGRESQL / REDIS / MINIO</tspan></text>
  <text x="376" y="460" class="stack muted"><tspan class="cyan">INFRA    </tspan><tspan>DOCKER COMPOSE / NGINX / GITHUB ACTIONS</tspan></text>
  <path class="divider" d="M24 494H696"/>
</svg>
