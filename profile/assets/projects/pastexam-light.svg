<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" role="img" aria-labelledby="title desc">
  <title id="title">PHYSARCHIVE — NTHU Physics Past Exam Platform</title>
  <desc id="desc">Light-mode engineering console card for the student archive platform, showing course search and preview, submission, review, discussion, and its verified technology stack.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#B8C9D1" stroke-width="0.6" opacity="0.42"/>
    </pattern>
    <style>
      text{font-family:"Courier New",Courier,"Liberation Mono","DejaVu Sans Mono",monospace;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1.5}
      .raised{fill:#F4F7F8;stroke:#B8C9D1;stroke-width:1}
      .module{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1}
      .divider{fill:none;stroke:#B8C9D1;stroke-width:1}
      .primary{fill:#0A1720}.muted{fill:#536875}.green{fill:#087A4B}.cyan{fill:#006D85}.amber{fill:#8A6500}
      .title{font-size:20px;font-weight:600;letter-spacing:0.7px}
      .subtitle{font-size:13.5px;font-weight:800;letter-spacing:0.35px}
      .meta{font-size:11.5px;font-weight:700;letter-spacing:0.35px}
      .repo{font-size:9.5px;font-weight:700;letter-spacing:0}
      .stack{font-size:9.5px;font-weight:700;letter-spacing:0.15px}
      .label{font-size:11px;font-weight:800;letter-spacing:0.7px}
      .node-id{font-size:9px;font-weight:800;letter-spacing:0.6px}
      .node-meta{font-size:8.5px;font-weight:700}
    </style>
  </defs>

  <rect class="panel" x="12" y="12" width="1176" height="252" rx="4"/>
  <path class="divider" d="M12 54H1188M760 20V46M972 20V46"/>
  <rect x="28" y="28" width="8" height="8" class="green"/>
  <text x="48" y="37" class="label primary">PROJECT CONSOLE / 01</text>
  <text x="776" y="37" class="meta muted">PUBLIC STUDENT SYSTEM</text>
  <text x="1172" y="37" text-anchor="end" class="label green">STATUS: ACTIVE DEVELOPMENT</text>

  <rect x="28" y="66" width="334" height="174" rx="3" fill="none" stroke="#B8C9D1" stroke-width="1"/>
  <text x="46" y="103" class="title primary">PHYSARCHIVE</text>
  <text x="46" y="132" class="subtitle primary">NTHU PHYSICS PAST EXAM PLATFORM</text>
  <text x="46" y="160" class="meta muted">SEARCHABLE MATERIALS / STUDENT WORKFLOWS</text>
  <path class="divider" d="M46 176H344"/>
  <text x="46" y="198" class="label muted">REPOSITORY</text>
  <text x="126" y="198" class="repo primary">NTHU-Physics-SA-IT/PastExamWeb_PHY</text>
  <text x="46" y="220" class="label muted">LIVE</text>
  <text x="126" y="220" class="meta green">physarchive.com</text>

  <rect class="raised" x="374" y="66" width="438" height="174" rx="3"/>
  <rect x="374" y="66" width="438" height="174" rx="3" fill="url(#grid)"/>
  <text x="390" y="90" class="label cyan">QUERY / COURSE ARCHIVE</text>
  <text x="796" y="90" text-anchor="end" class="meta muted">DOCUMENT INDEX</text>
  <rect class="module" x="390" y="100" width="406" height="30" rx="2"/>
  <rect x="402" y="111" width="8" height="8" fill="none" stroke="#087A4B" stroke-width="1.5"/>
  <path d="M409 118L414 123" stroke="#087A4B" stroke-width="1.5"/>
  <text x="423" y="120" class="meta muted">course / semester / instructor / exam type</text>

  <rect class="module" x="390" y="140" width="142" height="86" rx="2"/>
  <text x="402" y="158" class="label primary">COURSE INDEX</text>
  <rect x="402" y="169" width="6" height="6" class="green"/>
  <text x="416" y="175" class="meta muted">COURSE</text>
  <rect x="402" y="187" width="6" height="6" class="cyan"/>
  <text x="416" y="193" class="meta muted">SEMESTER</text>
  <rect x="402" y="205" width="6" height="6" class="amber"/>
  <text x="416" y="211" class="meta muted">ANSWER FILTER</text>

  <rect class="module" x="544" y="140" width="252" height="86" rx="2"/>
  <path d="M558 154H579L588 163V211H558Z" fill="none" stroke="#006D85" stroke-width="1.3"/>
  <path d="M579 154V163H588" fill="none" stroke="#006D85" stroke-width="1.3"/>
  <text x="573" y="185" text-anchor="middle" class="node-id cyan">PDF</text>
  <text x="600" y="158" class="label primary">PDF PREVIEW</text>
  <text x="600" y="178" class="meta muted">PREVIEW / DOWNLOAD</text>
  <text x="600" y="196" class="meta muted">COMMENTS / REVIEW</text>
  <rect x="600" y="207" width="6" height="6" class="green"/>
  <text x="614" y="213" class="meta green">SUBMISSION STATUS</text>

  <rect class="raised" x="824" y="66" width="348" height="174" rx="3"/>
  <rect x="824" y="66" width="348" height="174" rx="3" fill="url(#grid)"/>
  <text x="840" y="90" class="label cyan">WORKFLOW / VERIFIED STACK</text>
  <rect class="module" x="840" y="100" width="96" height="25" rx="2"/>
  <rect x="850" y="110" width="6" height="6" class="green"/>
  <text x="866" y="117" class="label primary">SEARCH</text>
  <rect class="module" x="946" y="100" width="96" height="25" rx="2"/>
  <rect x="956" y="110" width="6" height="6" class="cyan"/>
  <text x="972" y="117" class="label primary">PREVIEW</text>
  <rect class="module" x="1052" y="100" width="104" height="25" rx="2"/>
  <rect x="1062" y="110" width="6" height="6" class="amber"/>
  <text x="1078" y="117" class="label primary">SUBMIT</text>
  <rect class="module" x="840" y="133" width="149" height="25" rx="2"/>
  <rect x="850" y="143" width="6" height="6" class="green"/>
  <text x="866" y="150" class="label primary">REVIEW</text>
  <rect class="module" x="999" y="133" width="157" height="25" rx="2"/>
  <rect x="1009" y="143" width="6" height="6" class="cyan"/>
  <text x="1025" y="150" class="label primary">DISCUSS</text>
  <path class="divider" d="M840 166H1156"/>
  <text x="840" y="181" class="stack muted"><tspan class="cyan">FRONTEND  </tspan><tspan>VUE 3 / VITE / PRIMEVUE / TAILWIND CSS</tspan></text>
  <text x="840" y="197" class="stack muted"><tspan class="green">BACKEND   </tspan><tspan>PYTHON / FASTAPI / SQLMODEL / ALEMBIC</tspan></text>
  <text x="840" y="213" class="stack muted"><tspan class="amber">DATA      </tspan><tspan>POSTGRESQL / REDIS / MINIO</tspan></text>
  <text x="840" y="229" class="stack muted"><tspan class="cyan">INFRA     </tspan><tspan>DOCKER COMPOSE / NGINX / GITHUB ACTIONS</tspan></text>
  <path class="divider" d="M28 252H1172"/>
</svg>
