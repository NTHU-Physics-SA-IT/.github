<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PHYSARCHIVE — NTHU Physics Past Exam Platform</title>
  <desc id="desc">Light-mode engineering console card for the student archive platform, showing its identity, archive workflow, service topology, features, and verified technology stack.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#B8C9D1" stroke-width="0.6" opacity="0.42"/>
    </pattern>
    <marker id="arrow-request" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#006D85"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#8A6500"/>
    </marker>
    <style>
      text{font-family:"Courier New",Courier,"Liberation Mono","DejaVu Sans Mono",monospace;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1.5}
      .raised{fill:#EAF0F2;stroke:#B8C9D1;stroke-width:1}
      .module{fill:#FFFFFF;stroke:#B8C9D1;stroke-width:1}
      .divider{fill:none;stroke:#B8C9D1;stroke-width:1}
      .primary{fill:#0A1720}.muted{fill:#536875}.green{fill:#087A4B}.cyan{fill:#006D85}.amber{fill:#8A6500}
      .title{font-size:30px;font-weight:900;letter-spacing:0.7px}
      .subtitle{font-size:13.5px;font-weight:800;letter-spacing:0.35px}
      .meta{font-size:11.5px;font-weight:700;letter-spacing:0.35px}
      .repo{font-size:9.5px;font-weight:700;letter-spacing:0}
      .stack{font-size:9.5px;font-weight:700;letter-spacing:0.15px}
      .label{font-size:11px;font-weight:800;letter-spacing:0.7px}
      .body{font-size:12.5px;font-weight:700}
      .node-id{font-size:9px;font-weight:800;letter-spacing:0.6px}
      .node-label{font-size:11px;font-weight:800}
      .node-meta{font-size:8.5px;font-weight:700}
      .request-bus{fill:none;stroke:#006D85;stroke-width:1.6}
      .data-bus{fill:none;stroke:#8A6500;stroke-width:1.4}
      .wire{fill:none;stroke:#536875;stroke-width:1;opacity:0.7}
    </style>
  </defs>

  <rect class="panel" x="12" y="12" width="1176" height="296" rx="4"/>
  <path class="divider" d="M12 54H1188M760 20V46M972 20V46"/>
  <rect x="28" y="28" width="8" height="8" class="green"/>
  <text x="48" y="37" class="label primary">PROJECT CONSOLE / 01</text>
  <text x="776" y="37" class="meta muted">PUBLIC STUDENT SYSTEM</text>
  <text x="1172" y="37" text-anchor="end" class="label green">STATUS: ACTIVE DEVELOPMENT</text>

  <rect class="raised" x="28" y="66" width="334" height="174" rx="3"/>
  <rect x="32" y="80" width="4" height="54" class="green"/>
  <text x="46" y="103" class="title primary">PHYSARCHIVE</text>
  <text x="46" y="125" class="subtitle cyan">NTHU PHYSICS PAST EXAM PLATFORM</text>
  <text x="46" y="153" class="body primary">面向清大物理系學生的考古題與課程資料平台</text>
  <text x="46" y="175" class="meta muted">SEARCHABLE MATERIALS / STUDENT WORKFLOWS</text>
  <path class="divider" d="M46 187H344"/>
  <text x="46" y="205" class="label muted">REPOSITORY</text>
  <text x="126" y="205" class="repo primary">NTHU-Physics-SA-IT/PastExamWeb_PHY</text>
  <text x="46" y="225" class="label muted">LIVE</text>
  <text x="126" y="225" class="meta green">physarchive.com</text>

  <rect class="raised" x="374" y="66" width="438" height="174" rx="3"/>
  <rect x="374" y="66" width="438" height="174" rx="3" fill="url(#grid)"/>
  <text x="390" y="90" class="label cyan">QUERY / COURSE ARCHIVE</text>
  <text x="796" y="90" text-anchor="end" class="meta muted">DOCUMENT INDEX</text>
  <rect class="module" x="390" y="100" width="406" height="30" rx="2"/>
  <rect x="402" y="111" width="8" height="8" fill="none" stroke="#087A4B" stroke-width="1.5"/>
  <path d="M409 118L414 123" stroke="#087A4B" stroke-width="1.5"/>
  <text x="423" y="120" class="meta muted">course / semester / instructor / exam type</text>

  <rect class="module" x="390" y="140" width="142" height="86" rx="2"/>
  <text x="402" y="158" class="label primary">COURSE INDEX</text>
  <rect x="402" y="169" width="6" height="6" class="green"/>
  <text x="416" y="175" class="meta muted">COURSE</text>
  <rect x="402" y="187" width="6" height="6" class="cyan"/>
  <text x="416" y="193" class="meta muted">SEMESTER</text>
  <rect x="402" y="205" width="6" height="6" class="amber"/>
  <text x="416" y="211" class="meta muted">ANSWER FILTER</text>

  <rect class="module" x="544" y="140" width="252" height="86" rx="2"/>
  <path d="M558 154H579L588 163V211H558Z" fill="none" stroke="#006D85" stroke-width="1.3"/>
  <path d="M579 154V163H588" fill="none" stroke="#006D85" stroke-width="1.3"/>
  <text x="573" y="185" text-anchor="middle" class="node-id cyan">PDF</text>
  <text x="600" y="158" class="label primary">PDF PREVIEW</text>
  <text x="600" y="178" class="meta muted">PREVIEW / DOWNLOAD</text>
  <text x="600" y="196" class="meta muted">COMMENTS / REVIEW</text>
  <rect x="600" y="207" width="6" height="6" class="green"/>
  <text x="614" y="213" class="meta green">SUBMISSION STATUS</text>

  <rect class="raised" x="824" y="66" width="348" height="174" rx="3"/>
  <rect x="824" y="66" width="348" height="174" rx="3" fill="url(#grid)"/>
  <text x="840" y="90" class="label cyan">SERVICE TOPOLOGY</text>
  <text x="1156" y="90" text-anchor="end" class="meta muted">DOCKER COMPOSE</text>

  <path class="request-bus" d="M892 127H918M982 127H1008M1072 127H1100" marker-end="url(#arrow-request)"/>
  <path class="data-bus" d="M1040 150V167H931V176M1040 167H1086V176" marker-end="url(#arrow-data)"/>
  <rect class="module" x="840" y="106" width="52" height="44" rx="2"/>
  <rect x="846" y="112" width="5" height="5" class="green"/>
  <text x="858" y="117" class="node-id muted">N01</text>
  <text x="866" y="133" text-anchor="middle" class="node-label primary">EDGE</text>
  <text x="866" y="144" text-anchor="middle" class="node-meta muted">NGINX</text>

  <rect class="module" x="918" y="106" width="64" height="44" rx="2"/>
  <rect x="924" y="112" width="5" height="5" class="cyan"/>
  <text x="936" y="117" class="node-id muted">N02</text>
  <text x="950" y="133" text-anchor="middle" class="node-label primary">UI</text>
  <text x="950" y="144" text-anchor="middle" class="node-meta muted">VUE 3</text>

  <rect class="module" x="1008" y="106" width="64" height="44" rx="2"/>
  <rect x="1014" y="112" width="5" height="5" class="cyan"/>
  <text x="1026" y="117" class="node-id muted">N03</text>
  <text x="1040" y="133" text-anchor="middle" class="node-label primary">API</text>
  <text x="1040" y="144" text-anchor="middle" class="node-meta muted">FASTAPI</text>

  <rect class="module" x="1100" y="106" width="56" height="44" rx="2"/>
  <rect x="1106" y="112" width="5" height="5" class="green"/>
  <text x="1118" y="117" class="node-id muted">S01</text>
  <text x="1128" y="133" text-anchor="middle" class="node-label primary">READY</text>
  <text x="1128" y="144" text-anchor="middle" class="node-meta muted">ROUTE</text>

  <rect class="module" x="882" y="176" width="98" height="38" rx="2"/>
  <rect x="888" y="182" width="5" height="5" class="amber"/>
  <text x="900" y="187" class="node-id muted">N04</text>
  <text x="931" y="199" text-anchor="middle" class="node-label primary">DATA</text>
  <text x="931" y="210" text-anchor="middle" class="node-meta muted">POSTGRESQL / REDIS</text>

  <rect class="module" x="1037" y="176" width="98" height="38" rx="2"/>
  <rect x="1043" y="182" width="5" height="5" class="amber"/>
  <text x="1055" y="187" class="node-id muted">N05</text>
  <text x="1086" y="199" text-anchor="middle" class="node-label primary">OBJECT</text>
  <text x="1086" y="210" text-anchor="middle" class="node-meta muted">MINIO</text>
  <text x="840" y="232" class="node-meta muted">REQUEST / DATA / OBJECT STORAGE PATH</text>

  <rect class="raised" x="28" y="250" width="1144" height="28" rx="2"/>
  <path class="divider" d="M257 250V278M486 250V278M715 250V278M944 250V278"/>
  <rect x="44" y="261" width="6" height="6" class="green"/>
  <text x="60" y="268" class="label primary">SEARCH</text>
  <rect x="273" y="261" width="6" height="6" class="cyan"/>
  <text x="289" y="268" class="label primary">PREVIEW</text>
  <rect x="502" y="261" width="6" height="6" class="amber"/>
  <text x="518" y="268" class="label primary">SUBMIT</text>
  <rect x="731" y="261" width="6" height="6" class="green"/>
  <text x="747" y="268" class="label primary">REVIEW</text>
  <rect x="960" y="261" width="6" height="6" class="cyan"/>
  <text x="976" y="268" class="label primary">DISCUSS</text>

  <text x="28" y="292" class="stack muted" xml:space="preserve"><tspan class="cyan">FRONTEND  </tspan><tspan>VUE 3 / VITE / PRIMEVUE / TAILWIND CSS</tspan></text>
  <text x="628" y="292" class="stack muted" xml:space="preserve"><tspan class="green">BACKEND  </tspan><tspan>PYTHON / FASTAPI / SQLMODEL / ALEMBIC</tspan></text>
  <text x="28" y="304" class="stack muted" xml:space="preserve"><tspan class="amber">DATA  </tspan><tspan>POSTGRESQL / REDIS / MINIO</tspan></text>
  <text x="628" y="304" class="stack muted" xml:space="preserve"><tspan class="cyan">INFRA  </tspan><tspan>DOCKER COMPOSE / NGINX / GITHUB ACTIONS</tspan></text>
</svg>
