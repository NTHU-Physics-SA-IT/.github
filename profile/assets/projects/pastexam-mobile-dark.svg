<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
  <title id="title">PHYSARCHIVE — NTHU Physics Past Exam Platform</title>
  <desc id="desc">Mobile dark-mode engineering console card for the student archive platform, showing identity, archive workflow, service topology, features, and technology stack.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1B3A4B" stroke-width="0.6" opacity="0.34"/>
    </pattern>
    <style>
      text{font-family:"Courier New",Courier,"Liberation Mono","DejaVu Sans Mono",monospace;font-weight:700}
      .panel{fill:#09131D;stroke:#1B3A4B;stroke-width:1.5}
      .raised{fill:#0D1B27;stroke:#1B3A4B;stroke-width:1}
      .module{fill:#09131D;stroke:#1B3A4B;stroke-width:1}
      .divider{fill:none;stroke:#1B3A4B;stroke-width:1}
      .primary{fill:#F1F6F8}.muted{fill:#91A6B5}.green{fill:#65F2AE}.cyan{fill:#55D8F5}.amber{fill:#EBCB72}
      .title{font-size:31px;font-weight:900;letter-spacing:0.6px}
      .subtitle{font-size:14px;font-weight:800}
      .meta{font-size:11.5px;font-weight:700;letter-spacing:0.2px}
      .label{font-size:11px;font-weight:800;letter-spacing:0.6px}
      .body{font-size:13px;font-weight:700}
      .node-id{font-size:9px;font-weight:800;letter-spacing:0.5px}
      .node-label{font-size:10.5px;font-weight:800}
      .node-meta{font-size:8.5px;font-weight:700}
      .request-bus{fill:none;stroke:#55D8F5;stroke-width:1.5}
      .data-bus{fill:none;stroke:#EBCB72;stroke-width:1.4}
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="700" height="560" rx="6"/>
  <path class="divider" d="M10 58H710M466 18V50"/>
  <rect x="26" y="29" width="8" height="8" class="green"/>
  <text x="46" y="38" class="label primary">PROJECT CONSOLE / 01</text>
  <text x="694" y="38" text-anchor="end" class="label green">STATUS: ACTIVE DEVELOPMENT</text>
  <text x="26" y="53" class="meta muted">PUBLIC STUDENT SYSTEM</text>

  <rect class="raised" x="26" y="72" width="668" height="122" rx="3"/>
  <rect x="30" y="86" width="4" height="50" class="green"/>
  <text x="46" y="108" class="title primary">PHYSARCHIVE</text>
  <text x="46" y="130" class="subtitle cyan">NTHU PHYSICS PAST EXAM PLATFORM</text>
  <text x="46" y="153" class="body primary">面向清大物理系學生的考古題與課程資料平台</text>
  <text x="46" y="176" class="meta muted">SEARCHABLE MATERIALS / STUDENT WORKFLOWS</text>
  <text x="678" y="108" text-anchor="end" class="label muted">REPOSITORY</text>
  <text x="678" y="127" text-anchor="end" class="meta primary">NTHU-Physics-SA-IT/PastExamWeb_PHY</text>
  <text x="678" y="154" text-anchor="end" class="label muted">LIVE</text>
  <text x="678" y="173" text-anchor="end" class="meta green">physarchive.com</text>

  <rect class="raised" x="26" y="208" width="668" height="136" rx="3"/>
  <rect x="26" y="208" width="668" height="136" rx="3" fill="url(#grid)"/>
  <text x="42" y="232" class="label cyan">QUERY / COURSE ARCHIVE</text>
  <text x="678" y="232" text-anchor="end" class="meta muted">DOCUMENT INDEX</text>
  <rect class="module" x="42" y="242" width="636" height="30" rx="2"/>
  <rect x="54" y="253" width="8" height="8" fill="none" stroke="#65F2AE" stroke-width="1.5"/>
  <path d="M61 260L66 265" stroke="#65F2AE" stroke-width="1.5"/>
  <text x="76" y="262" class="meta muted">course / semester / instructor / exam type</text>

  <rect class="module" x="42" y="284" width="194" height="44" rx="2"/>
  <rect x="54" y="297" width="6" height="6" class="green"/>
  <text x="70" y="303" class="label primary">COURSE INDEX</text>
  <text x="54" y="319" class="node-meta muted">COURSE / SEMESTER / ANSWER FILTER</text>

  <rect class="module" x="248" y="284" width="194" height="44" rx="2"/>
  <rect x="260" y="297" width="6" height="6" class="cyan"/>
  <text x="276" y="303" class="label primary">PDF PREVIEW</text>
  <text x="260" y="319" class="node-meta muted">PREVIEW / DOWNLOAD / COMMENTS</text>

  <rect class="module" x="454" y="284" width="224" height="44" rx="2"/>
  <rect x="466" y="297" width="6" height="6" class="amber"/>
  <text x="482" y="303" class="label primary">SUBMIT + REVIEW</text>
  <text x="466" y="319" class="node-meta green">SUBMISSION STATUS / DISCUSS</text>

  <rect class="raised" x="26" y="358" width="668" height="112" rx="3"/>
  <rect x="26" y="358" width="668" height="112" rx="3" fill="url(#grid)"/>
  <text x="42" y="382" class="label cyan">SERVICE TOPOLOGY</text>
  <text x="678" y="382" text-anchor="end" class="meta muted">DOCKER COMPOSE</text>
  <path class="request-bus" d="M150 419H166M274 419H290"/>
  <path class="data-bus" d="M398 419H414M522 419H538"/>

  <rect class="module" x="42" y="394" width="108" height="50" rx="2"/>
  <rect x="50" y="402" width="5" height="5" class="green"/>
  <text x="63" y="407" class="node-id muted">N01</text>
  <text x="96" y="421" text-anchor="middle" class="node-label primary">EDGE</text>
  <text x="96" y="435" text-anchor="middle" class="node-meta muted">NGINX</text>

  <rect class="module" x="166" y="394" width="108" height="50" rx="2"/>
  <rect x="174" y="402" width="5" height="5" class="cyan"/>
  <text x="187" y="407" class="node-id muted">N02</text>
  <text x="220" y="421" text-anchor="middle" class="node-label primary">UI</text>
  <text x="220" y="435" text-anchor="middle" class="node-meta muted">VUE 3</text>

  <rect class="module" x="290" y="394" width="108" height="50" rx="2"/>
  <rect x="298" y="402" width="5" height="5" class="cyan"/>
  <text x="311" y="407" class="node-id muted">N03</text>
  <text x="344" y="421" text-anchor="middle" class="node-label primary">API</text>
  <text x="344" y="435" text-anchor="middle" class="node-meta muted">FASTAPI</text>

  <rect class="module" x="414" y="394" width="108" height="50" rx="2"/>
  <rect x="422" y="402" width="5" height="5" class="amber"/>
  <text x="435" y="407" class="node-id muted">N04</text>
  <text x="468" y="421" text-anchor="middle" class="node-label primary">DATA</text>
  <text x="468" y="435" text-anchor="middle" class="node-meta muted">PG + REDIS</text>

  <rect class="module" x="538" y="394" width="140" height="50" rx="2"/>
  <rect x="546" y="402" width="5" height="5" class="amber"/>
  <text x="559" y="407" class="node-id muted">N05</text>
  <text x="608" y="421" text-anchor="middle" class="node-label primary">OBJECT</text>
  <text x="608" y="435" text-anchor="middle" class="node-meta muted">MINIO</text>
  <text x="42" y="461" class="node-meta muted">REQUEST / DATA / OBJECT STORAGE PATH</text>

  <rect class="raised" x="26" y="482" width="668" height="40" rx="2"/>
  <path class="divider" d="M159.6 482V522M293.2 482V522M426.8 482V522M560.4 482V522"/>
  <rect x="42" y="499" width="6" height="6" class="green"/>
  <text x="58" y="506" class="label primary">SEARCH</text>
  <rect x="175" y="499" width="6" height="6" class="cyan"/>
  <text x="191" y="506" class="label primary">PREVIEW</text>
  <rect x="309" y="499" width="6" height="6" class="amber"/>
  <text x="325" y="506" class="label primary">SUBMIT</text>
  <rect x="443" y="499" width="6" height="6" class="green"/>
  <text x="459" y="506" class="label primary">REVIEW</text>
  <rect x="577" y="499" width="6" height="6" class="cyan"/>
  <text x="593" y="506" class="label primary">DISCUSS</text>

  <text x="26" y="538" class="meta muted" xml:space="preserve"><tspan class="cyan">APP:  </tspan><tspan>VUE 3 / VITE / PRIMEVUE / TAILWIND / PYTHON / FASTAPI</tspan></text>
  <text x="26" y="552" class="meta muted" xml:space="preserve"><tspan class="amber">DATA: </tspan><tspan>SQLMODEL / POSTGRESQL / REDIS / MINIO</tspan></text>
  <text x="26" y="566" class="meta muted" xml:space="preserve"><tspan class="green">INFRA:</tspan><tspan> DOCKER COMPOSE / NGINX / GITHUB ACTIONS</tspan></text>
</svg>
