<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="contact-mobile-title contact-mobile-desc">
  <title id="contact-mobile-title">Contact the NTHU Physics Student Association IT Team</title>
  <desc id="contact-mobile-desc">Light mobile command-line contact card with the public GitHub organization, Physics Archive website, and contribution status.</desc>
  <defs>
    <style>
      text {
        font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-weight: 500;
      }
      .meta { font-size: 14px; font-weight: 500; letter-spacing: .25px; }
      .command { font-size: 20px; font-weight: 700; }
      .entry { font-size: 19px; font-weight: 500; }
      .label { font-weight: 600; }
      .status { font-weight: 600; }
    </style>
  </defs>

  <rect x="10" y="10" width="700" height="230" rx="6" fill="#FFFFFF" stroke="#B8C9D1" stroke-width="1.5"/>
  <path d="M10 55H710" stroke="#B8C9D1" stroke-width="1"/>
  <rect x="22" y="27" width="8" height="8" fill="#087A4B"/>
  <text x="42" y="40" class="meta" fill="#536875">CONTACT CONSOLE</text>
  <text x="696" y="40" text-anchor="end" class="meta" fill="#536875">PUBLIC / ONLINE</text>

  <g aria-label="Public contact information">
    <text x="28" y="92" class="command" fill="#0A1720">&gt; connect --organization NTHU-Physics-SA-IT</text>
    <text x="28" y="132" class="entry" fill="#0A1720">
      <tspan class="label" fill="#006D85">GITHUB</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>github.com/NTHU-Physics-SA-IT</tspan>
    </text>
    <text x="28" y="167" class="entry" fill="#0A1720">
      <tspan class="label" fill="#006D85">SYSTEM</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>physarchive.com</tspan>
    </text>
    <text x="28" y="202" class="entry status" fill="#087A4B">
      <tspan>STATUS</tspan>
      <tspan fill="#536875"> : </tspan>
      <tspan>OPEN TO CONTRIBUTIONS_</tspan>
    </text>
    <rect x="682" y="193" width="7" height="7" fill="#087A4B"/>
  </g>
</svg>
