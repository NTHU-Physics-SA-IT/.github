<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="contact-title contact-desc">
  <title id="contact-title">Contact the NTHU Physics Student Association IT Team</title>
  <desc id="contact-desc">Dark full-width command-line contact card with the public GitHub organization, Physics Archive website, and contribution status.</desc>
  <defs>
    <style>
      text {
        font-family: "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
        font-weight: 500;
      }
      .meta { font-size: 12px; font-weight: 500; letter-spacing: .3px; }
      .command { font-size: 18px; font-weight: 700; }
      .entry { font-size: 16px; font-weight: 500; }
      .label { font-weight: 600; }
      .status { font-weight: 600; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="166" rx="4" fill="#09131D" stroke="#1B3A4B" stroke-width="1.5"/>
  <path d="M12 48H1188" stroke="#1B3A4B" stroke-width="1"/>
  <rect x="25" y="27" width="8" height="8" fill="#65F2AE"/>
  <text x="46" y="37" class="meta" fill="#91A6B5">CONTACT CONSOLE / PUBLIC ENDPOINTS</text>
  <text x="1174" y="37" text-anchor="end" class="meta" fill="#91A6B5">PUBLIC / ONLINE</text>

  <g aria-label="Public contact information">
    <text x="30" y="78" class="command" fill="#F1F6F8">&gt; connect --organization NTHU-Physics-SA-IT</text>
    <text x="30" y="116" class="entry" fill="#F1F6F8">
      <tspan class="label" fill="#55D8F5">GITHUB</tspan>
      <tspan fill="#91A6B5"> : </tspan>
      <tspan>github.com/NTHU-Physics-SA-IT</tspan>
    </text>
    <text x="30" y="148" class="entry" fill="#F1F6F8">
      <tspan class="label" fill="#55D8F5">SYSTEM</tspan>
      <tspan fill="#91A6B5"> : </tspan>
      <tspan>physarchive.com</tspan>
    </text>
    <text x="780" y="148" class="entry status" fill="#65F2AE">
      <tspan>STATUS</tspan>
      <tspan fill="#91A6B5"> : </tspan>
      <tspan>OPEN TO CONTRIBUTIONS_</tspan>
    </text>
    <rect x="1152" y="139" width="7" height="7" fill="#65F2AE"/>
  </g>
</svg>
